<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paradox 2026 — Event Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="index-body">
  <div class="index-card">
    <h1>Paradox 2026</h1>
    <p class="index-subtitle">
      Event preview for department &amp; event heads.<br />
      Shows exactly how the student-facing site will display events.
    </p>

    <div class="field">
      <label for="dept">Department</label>
      <select id="dept" onchange="updateBtn()">
        <option value="cultural">Culturals</option>
        <option value="technicals">Technicals</option>
        <option value="sports">Sports</option>
      </select>
    </div>

    <p class="index-err" id="err">CSV URL not configured for this department yet.</p>
    <button id="btn-preview" onclick="go()">Preview Culturals</button>
  </div>

  <script src="shared.js"></script>
  <script>
    // Seed the button with the default (cultural) theme vars so the
    // CSS-var-driven button colour is correct before any interaction.
    applyTheme('cultural');

    function updateBtn() {
      const dept = document.getElementById('dept').value;
      applyTheme(dept);
      document.getElementById('btn-preview').textContent =
        'Preview ' + { cultural: 'Culturals', technicals: 'Technicals', sports: 'Sports' }[dept];
    }

    function go() {
      const dept = document.getElementById('dept').value;
      const csv  = SHEET_CSVS[dept];
      const err  = document.getElementById('err');
      if (!csv) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      window.location.href = 'preview.html?' + new URLSearchParams({ dept, csv }).toString();
    }
  </script>
</body>
</html>
