<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paradox 2026 — Event Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #080818;
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 1.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      color: #e0c97f;
    }

    .subtitle {
      font-family: sans-serif;
      font-size: 0.85rem;
      opacity: 0.5;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .field { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-family: sans-serif;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      opacity: 0.5;
      margin-bottom: 0.4rem;
    }

    select, input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
    }
    select { font-family: sans-serif; }
    select option { background: #1a1a2e; color: #fff; }
    select:focus, input:focus { border-color: rgba(255,255,255,0.35); }

    .hint {
      font-family: sans-serif;
      font-size: 0.72rem;
      opacity: 0.38;
      margin-top: 0.35rem;
      line-height: 1.5;
    }

    button {
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem;
      border: none;
      border-radius: 8px;
      font-family: Georgia, serif;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }

    #btn-cultural  { background: #521570; color: #fdf7c7; }
    #btn-technical { background: #23345C; color: #dbdccd; }
    #btn-sports    { background: #5C1C15; color: #f1d7c4; }

    .err {
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #f87171;
      margin-top: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Paradox 2026</h1>
    <p class="subtitle">
      Event preview for department &amp; event heads.<br/>
      Shows exactly how the student-facing site will display events.
    </p>

    <div class="field">
      <label>Department</label>
      <select id="dept">
        <option value="cultural">Culturals</option>
        <option value="technicals">Technicals</option>
        <option value="sports">Sports</option>
      </select>
    </div>

    <div class="field">
      <label>Sheet Published CSV URL</label>
      <input id="csv_url" type="text"
        placeholder="https://docs.google.com/spreadsheets/d/.../pub?output=csv" />
      <p class="hint">
        File → Share → Publish to web → select the sheet → CSV → Copy link.<br/>
        Only rows where <strong>is_approved = TRUE</strong> will show.
      </p>
    </div>

    <p class="err" id="err">Please fill in all fields.</p>

    <button id="btn-cultural"  onclick="go('cultural')">Preview Culturals</button>
    <button id="btn-technical" onclick="go('technicals')" style="margin-top:0.6rem;">Preview Technicals</button>
    <button id="btn-sports"    onclick="go('sports')" style="margin-top:0.6rem;">Preview Sports</button>
  </div>

  <script>
    function go(dept) {
      const csv = document.getElementById('csv_url').value.trim();
      const err = document.getElementById('err');
      if (!csv) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      const params = new URLSearchParams({ dept, csv });
      window.location.href = 'preview.html?' + params.toString();
    }
  </script>
</body>
</html>
