<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Preview — Paradox 2026</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="preview-body">
  <!-- Background -->
  <div id="bg">
    <div id="bg-gradient"></div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <a class="back-btn" href="index.html">&#8592; Back</a>
    <span class="preview-badge">Preview Mode</span>
  </div>

  <!-- Content -->
  <div class="preview-content">
    <h1 id="dept-title"></h1>
    <div id="events-container" class="state-panel">
      <div class="spinner"></div>
      <p class="state-loading-text">Loading events&hellip;</p>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const dept   = params.get('dept') || 'cultural';
      const csvUrl = params.get('csv');

      applyTheme(dept);

      const titleEl = document.getElementById('dept-title');
      titleEl.textContent = DEPT_LABELS[dept] || dept.toUpperCase();
      document.title = titleEl.textContent + ' — Paradox 2026 Preview';

      if (!csvUrl || csvUrl === 'MISSING') {
        showError('No CSV URL provided. Go back and select a department.');
        return;
      }

      // Published Google Sheets CSVs have Access-Control-Allow-Origin: * — direct fetch works.
      fetch(csvUrl)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(csv => render(parseSheet(csv)))
        .catch(err => showError('Failed to load sheet: ' + err.message +
          '. Make sure the sheet is published to web as CSV.'));

      function render(events) {
        const container = document.getElementById('events-container');

        if (events.length === 0) {
          container.innerHTML =
            '<p class="coming-soon">COMING SOON</p>' +
            '<p class="coming-soon-sub">No approved events yet</p>';
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'events-grid';

        events.forEach((ev, idx) => {
          const a = document.createElement('a');
          a.className = 'event-card-link';
          const ep = new URLSearchParams({
            dept,
            poster_id:  ev.poster_id,
            details_id: ev.details_id,
            form_id:    ev.form_id,
          });
          a.href  = 'event.html?' + ep.toString();
          a.title = ev.name;

          // Staggered fade-in animation
          a.style.opacity   = '0';
          a.style.transform = 'translateY(20px)';
          a.style.transition =
            `opacity 0.5s ${idx * 0.08}s, transform 0.5s ${idx * 0.08}s`;

          const inner = document.createElement('div');
          inner.className = 'event-card-inner';

          if (ev.poster_id) {
            const img = document.createElement('img');
            img.alt = ev.name;
            img.src = driveImgUrl(ev.poster_id);
            img.onerror = () => {
              img.style.display = 'none';
              inner.insertAdjacentHTML(
                'beforeend',
                '<span class="placeholder-text">' + ev.name + '</span>'
              );
            };
            inner.appendChild(img);
          } else {
            inner.innerHTML = '<span class="placeholder-text">' + ev.name + '</span>';
          }

          a.appendChild(inner);
          grid.appendChild(a);

          // Trigger animation after paint
          requestAnimationFrame(() => requestAnimationFrame(() => {
            a.style.opacity   = '1';
            a.style.transform = 'translateY(0)';
          }));
        });

        container.className = ''; // remove state-panel centering
        container.innerHTML = '';
        container.appendChild(grid);
      }

      function showError(msg) {
        document.getElementById('events-container').innerHTML =
          '<p class="err-msg">' + msg + '</p>';
      }
    })();
  </script>
</body>
</html>
