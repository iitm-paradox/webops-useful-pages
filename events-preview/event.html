<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event — Paradox 2026 Preview</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="event-body">
  <!-- Background -->
  <div id="bg">
    <div id="bg-gradient"></div>
  </div>

  <!-- Top bar -->
  <div class="top-bar">
    <a class="back-btn" href="javascript:history.back()">&#8592; Back</a>
    <span class="preview-badge">Preview Mode</span>
  </div>

  <!-- Page wrapper -->
  <div class="event-page">
    <div class="event-card">
      <div id="root">
        <div class="spinner event-spinner"></div>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script>
    const p    = new URLSearchParams(location.search);
    const dept = p.get('dept') || 'cultural';
    applyTheme(dept);

    // Data comes via sessionStorage (keyed by ?key=) or directly via URL params
    let posterUrl   = '';
    let detailsJson = '';

    const storageKey = p.get('key');
    if (storageKey) {
      try {
        const stored = JSON.parse(sessionStorage.getItem(storageKey) || '{}');
        posterUrl   = stored.poster_url   || '';
        detailsJson = stored.details_json || '';
      } catch(e) {}
    } else {
      posterUrl   = p.get('poster_url')   || '';
      detailsJson = p.get('details_json') || '';
    }

    if (!detailsJson) {
      document.getElementById('root').innerHTML =
        '<p class="event-err">No event data — go back and click an event card.</p>';
    } else {
      try {
        render(JSON.parse(detailsJson));
      } catch(e) {
        document.getElementById('root').innerHTML =
          '<p class="event-err">Failed to parse event details JSON: ' + e.message + '</p>';
      }
    }

    function render(ev) {
      const prizes = [];
      if (parseFloat(ev.first_prize_amount  || 0) > 0) prizes.push(['1st Prize', ev.first_prize_amount]);
      if (parseFloat(ev.second_prize_amount || 0) > 0) prizes.push(['2nd Prize', ev.second_prize_amount]);
      if (parseFloat(ev.third_prize_amount  || 0) > 0) prizes.push(['3rd Prize', ev.third_prize_amount]);

      document.getElementById('root').innerHTML = `
        <div class="card-body">
          <div class="card-header">
            <span>${DEPT_HEADER_LABELS[dept] || dept.toUpperCase()}</span>
          </div>

          <div class="card-content">
            <!-- Poster -->
            <div class="poster-wrap">
              <div class="poster-frame">
                ${posterUrl
                  ? `<img src="${posterUrl}" alt="${ev.name}" />`
                  : `<span class="poster-placeholder">No poster</span>`
                }
              </div>
            </div>

            <!-- Left column -->
            <div class="event-inner">
              <h1 class="event-name">${ev.name || '—'}</h1>

              <div class="btn-row">
                <button class="btn-primary" onclick="openForm()">Enter Event &rarr;</button>
                ${ev.rules
                  ? `<a class="btn-outline" href="${ev.rules}" target="_blank">&#128218; Rulebook</a>`
                  : ''}
              </div>

              <div class="meta-grid">
                <div class="meta-item">
                  <span class="meta-label">Team Size</span>
                  <span>Min: ${ev.min_team_size ?? 1} | Max: ${ev.max_team_size ?? 1}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Rounds</span>
                  <span>${(ev.rounds || []).length}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Start</span>
                  <span>${fmtDate(ev.start_date)}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">End</span>
                  <span>${fmtDate(ev.end_date)}</span>
                </div>
                ${ev.registration_start_date
                  ? `<div class="meta-item">
                       <span class="meta-label">Reg Start</span>
                       <span>${fmtDate(ev.registration_start_date)}</span>
                     </div>`
                  : ''}
                ${ev.registration_end_date
                  ? `<div class="meta-item">
                       <span class="meta-label">Reg End</span>
                       <span>${fmtDate(ev.registration_end_date)}</span>
                     </div>`
                  : ''}
              </div>
            </div><!-- .event-inner -->

            <div class="divider"></div>

            <!-- Description -->
            ${ev.description ? `
            <div class="section description">
              <h2 class="section-title">Event Detail</h2>
              ${ev.description.split('\n').map(line => `<p>${line}</p>`).join('')}
            </div>` : ''}

            <!-- Prizes -->
            ${prizes.length ? `
            <div class="section">
              <h2 class="section-title">&#127942; Prizes</h2>
              <div class="prizes">
                ${prizes.map(([label, amt]) => `
                  <div class="prize-card">
                    <div class="prize-label">${label}</div>
                    <div class="prize-amount">&#8377;${parseFloat(amt)}</div>
                  </div>`).join('')}
              </div>
            </div>` : ''}

            <!-- Rounds -->
            ${(ev.rounds || []).length ? `
            <div class="section">
              <h2 class="section-title">Rounds &amp; Timeline</h2>
              <div class="rounds">
                ${ev.rounds.map(r => `
                  <div class="round-item">
                    <div class="round-dot"></div>
                    <div class="round-name">${r.name}</div>
                    <div class="round-meta">&#128197; ${fmtDateTime(r.start_time)}${r.location ? ' &middot; &#128205; ' + r.location : ''}</div>
                    <div class="round-desc">${r.description || ''}</div>
                  </div>`).join('')}
              </div>
            </div>` : ''}

            <!-- FAQs -->
            ${(ev.faqs || []).length ? `
            <div class="section">
              <h2 class="section-title">Frequently Asked Questions</h2>
              <div class="faqs">
                ${ev.faqs.map((f, i) => `
                  <div class="faq-item">
                    <button class="faq-q" onclick="toggleFaq(${i})">
                      <span>${f.question}</span>
                      <span id="faq-arrow-${i}">&#9660;</span>
                    </button>
                    <div class="faq-a" id="faq-a-${i}">${f.answer}</div>
                  </div>`).join('')}
              </div>
            </div>` : ''}

          </div><!-- .card-content -->
        </div><!-- .card-body -->
      `;
    }

    function toggleFaq(i) {
      const el    = document.getElementById('faq-a-' + i);
      const arrow = document.getElementById('faq-arrow-' + i);
      const open  = el.classList.toggle('open');
      arrow.innerHTML = open ? '&#9650;' : '&#9660;';
    }

    // ── Form modal ────────────────────────────────────────────────────────────
    let formData = null;

    // Load form_json from sessionStorage alongside event data
    if (storageKey) {
      try {
        const stored = JSON.parse(sessionStorage.getItem(storageKey) || '{}');
        if (stored.form_json) formData = JSON.parse(stored.form_json);
      } catch(e) {}
    }

    // formColor per dept — matches styles.formColor from student site
    const FORM_COLORS = {
      cultural:   '#521570',
      technicals: '#23345C',
      sports:     '#B62A31',
    };
    const formColor = FORM_COLORS[dept] || '#521570';

    function openForm() {
      if (!formData || !formData.blocks) {
        alert('No registration form available for this event yet.');
        return;
      }
      document.getElementById('form-modal').style.display = 'flex';
      document.body.style.overflow = 'hidden';
      renderForm(formData);
    }

    function closeForm() {
      document.getElementById('form-modal').style.display = 'none';
      document.body.style.overflow = '';
    }

    function renderForm(form) {
      const isMobile = window.innerWidth < 768;
      // Match student site: 2-col grid for most inputs
      const container = document.getElementById('form-fields');
      container.innerHTML = form.blocks.map(block => {
        const elements = (block.elements || []);
        return `
          <div style="margin-bottom:2rem;">
            ${block.title ? `<h3 style="font-family:Georgia,serif;font-size:1.1rem;border-bottom:1px solid ${formColor}40;padding-bottom:0.5rem;margin-bottom:1.25rem;color:${formColor};">${block.title}</h3>` : ''}
            <div style="display:grid;grid-template-columns:${isMobile ? '1fr' : '1fr 1fr'};gap:1.5rem 2.5rem;">
              ${elements.map(el => renderElement(el, elements.length)).join('')}
            </div>
          </div>`;
      }).join('');
    }

    function renderElement(el, totalInBlock) {
      const type = el.inputType || 'text';
      const isFullWidth = ['textarea','radio','checkbox'].includes(type) || totalInBlock === 1;
      const span = isFullWidth ? 'grid-column:1/-1;' : '';

      const labelStyle = `display:block;text-transform:uppercase;font-size:0.7rem;font-weight:bold;letter-spacing:0.2em;opacity:0.7;margin-bottom:0.5rem;color:${formColor};`;
      const inputStyle = `color:${formColor};background:${formColor};color:white;padding:0.6rem 1rem;outline:none;font-size:1rem;transition:colors;border-radius:2px;width:100%;border:none;`;
      const placeholder = el.element?.placeholder || '';

      if (type === 'textarea') {
        return `<div style="${span}display:flex;flex-direction:column;gap:0.5rem;">
          <label style="${labelStyle}">${el.label}</label>
          <textarea style="${inputStyle}min-height:100px;resize:none;" placeholder="${placeholder}"></textarea>
        </div>`;
      }
      if (type === 'select' || type === 'radio') {
        const inputs = el.element?.inputs || [];
        const hasLongOptions = inputs.some(o => o.length > 40);
        if (type === 'radio' || hasLongOptions) {
          const opts = inputs.map(o => `
            <label style="display:flex;align-items:flex-start;gap:0.75rem;color:white;font-size:0.95rem;cursor:pointer;">
              <div style="width:22px;height:22px;border-radius:50%;border:2.5px solid white;background:rgba(0,0,0,0.2);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;">
                <input type="radio" name="${el.name}" style="opacity:0;position:absolute;cursor:pointer;"/>
              </div>
              <span>${o}</span>
            </label>`).join('');
          return `<div style="${span}display:flex;flex-direction:column;gap:0.5rem;">
            <label style="${labelStyle}">${el.label}</label>
            <div style="background:${formColor};border-radius:2px;padding:1rem;display:flex;flex-direction:column;gap:1rem;">${opts}</div>
          </div>`;
        }
        const opts = inputs.map(o => `<option value="${o}" style="background:#1a1a2e;">${o}</option>`).join('');
        return `<div style="${span}display:flex;flex-direction:column;gap:0.5rem;">
          <label style="${labelStyle}">${el.label}</label>
          <select style="${inputStyle}cursor:pointer;appearance:none;">
            <option value="" style="background:#1a1a2e;">Select ${el.label}</option>${opts}
          </select>
        </div>`;
      }
      if (type === 'checkbox') {
        const inputs = el.element?.inputs || [];
        const opts = inputs.map(o => `
          <label style="display:flex;align-items:center;gap:0.75rem;color:white;font-size:0.95rem;cursor:pointer;">
            <div style="width:22px;height:22px;border-radius:3px;border:2.5px solid white;background:rgba(0,0,0,0.2);flex-shrink:0;"></div>
            <span>${o}</span>
          </label>`).join('');
        return `<div style="${span}display:flex;flex-direction:column;gap:0.5rem;">
          <label style="${labelStyle}">${el.label}</label>
          <div style="background:${formColor};border-radius:2px;padding:1rem;display:flex;flex-direction:column;gap:1rem;">${opts}</div>
        </div>`;
      }
      return `<div style="${span}display:flex;flex-direction:column;gap:0.5rem;">
        <label style="${labelStyle}">${el.label}</label>
        <input type="${type}" style="${inputStyle}" placeholder="${placeholder}"/>
      </div>`;
    }
  </script>

  <!-- Form modal — matches student site form.tsx design -->
  <div id="form-modal" style="display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);">
    <div style="position:relative;width:100%;max-width:56rem;" id="form-modal-inner">

      <!-- Close button (top-right, outside the card like student site) -->
      <button onclick="closeForm()" style="position:absolute;top:-3rem;right:-0.5rem;background:none;border:none;color:white;font-size:2rem;cursor:pointer;line-height:1;z-index:10;transition:transform 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'">&times;</button>

      <!-- Form card with background image from student site -->
      <div style="background-image:url(https://www.iitmparadox.org/images/events/event_specific/form_bg.avif);background-size:100% 100%;background-position:center;background-repeat:no-repeat;filter:drop-shadow(0 25px 25px rgba(0,0,0,0.15));aspect-ratio:1.8/1;display:flex;flex-direction:column;overflow:hidden;">

        <div id="form-inner" style="padding:2.5rem 4rem;height:100%;overflow:hidden;display:flex;flex-direction:column;">

          <!-- Title — matches student site -->
          <div style="display:flex;justify-content:center;text-align:center;margin-bottom:2rem;flex-shrink:0;">
            <h2 id="form-title" style="font-family:Georgia,serif;font-size:clamp(1.2rem,3vw,2.5rem);white-space:nowrap;border-bottom:3px solid;padding-bottom:0.6rem;display:inline-block;">
              Event Registration
            </h2>
          </div>

          <!-- Scrollable fields -->
          <div id="form-fields" style="flex:1;overflow-y:auto;padding-right:0.5rem;"></div>

          <!-- Preview note -->
          <div style="flex-shrink:0;padding-top:0.75rem;text-align:center;">
            <p style="font-size:0.72rem;opacity:0.45;">Preview only — form submission is not active.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Apply formColor to title border after DOM ready
    (function() {
      const title = document.getElementById('form-title');
      if (title) title.style.borderColor = formColor; title.style.color = formColor;
      const inner = document.getElementById('form-inner');
      if (inner) inner.style.color = formColor;
    })();
  </script>
</body>
</html>
