<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebOps — Useful Pages</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #080818;
      color: #fff;
      font-family: Georgia, 'Times New Roman', serif;
    }

    header { text-align: center; margin-bottom: 3rem; }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #e0c97f;
      margin-bottom: 0.4rem;
    }

    .tagline {
      font-family: sans-serif;
      font-size: 0.8rem;
      opacity: 0.4;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
      max-width: 420px;
    }

    a.link-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      text-decoration: none;
      color: #fff;
      transition: background 0.2s, border-color 0.2s;
    }
    a.link-card:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
    }

    .link-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .link-text {}
    .link-title {
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.15rem;
    }
    .link-desc {
      font-family: sans-serif;
      font-size: 0.75rem;
      opacity: 0.45;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <h1>WebOps</h1>
    <p class="tagline">Useful Pages — Paradox 2026</p>
  </header>

  <div class="links">
    <a class="link-card" href="events-preview/index.html">
      <span class="link-icon">🎭</span>
      <div class="link-text">
        <div class="link-title">Events Preview</div>
        <div class="link-desc">Preview how events appear on the student-facing site. For department &amp; event heads.</div>
      </div>
    </a>
  </div>
</body>
</html>
